<!-- index.html -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Anchor Vault</title>
    <meta name="theme-color" content="#0F1B2D" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Icons -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />

    <!-- Standalone / home screen behaviour -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Anchor" />

    <!-- Theme: apply the saved choice before the first paint (inside /app only), so there is no flash -->
    <script>
      (function () {
        try {
          if (location.pathname.indexOf('/app') !== 0) return;
          var saved = localStorage.getItem('anchor-theme');
          var light = saved === 'light' || (saved !== 'dark' && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
          document.documentElement.setAttribute('data-theme', light ? 'light' : 'dark');
          var bar = document.querySelector('meta[name="theme-color"]');
          if (bar) bar.setAttribute('content', light ? '#FAF8F4' : '#0F1B2D');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
